{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Welcome Back</h3>
        
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          
          <button type="submit" class="btn btn-success w-100 mt-3">Log In</button>
        </form>
        
        <hr class="my-4">
        
        <p class="text-center mb-0">
          Don't have an account? <a href="{% url 'store:signup' %}">Sign up here</a>.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
